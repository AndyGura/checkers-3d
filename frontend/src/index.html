<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#03040a" />
    <title>Checkers 3D</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23a3101b' stroke='%23ffd27a' stroke-width='3'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- The 3D table fills the window; everything else floats above it. -->
    <div id="stage" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <header>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>Checkers <span>3D</span></h1>
          <p class="brand-sub">on the Internet Computer</p>
        </div>
      </div>
      <div class="session">
        <button id="leaderboard-toggle" class="icon-btn" title="Leaderboard" aria-label="Leaderboard">🏆</button>
        <button id="reset-view" class="icon-btn" title="Reset the camera (or double-click the board)" aria-label="Reset camera">⟲</button>
        <span class="sid-wrap" title="Your session id — one per browser tab">
          <span class="label">Session</span>
          <code id="sid">…</code>
          <button id="new-sid" class="ghost small" title="Play as a different session">new</button>
        </span>
      </div>
    </header>

    <p id="error" class="toast" hidden></p>

    <main id="screen">
      <div class="hud-center"><div class="loader"></div><p>Entering the arena…</p></div>
    </main>

    <footer class="footnote">
      Backend <code id="backend-id"></code> · drag to orbit, scroll to zoom · Esc or right-click cancels a selection
    </footer>

    <div id="leaderboard-panel" class="modal" hidden>
      <div class="modal-box">
        <div class="modal-head">
          <h2>Leaderboard</h2>
          <button id="leaderboard-back" class="ghost small">Close</button>
        </div>
        <div id="leaderboard-body"></div>
      </div>
    </div>

    <div id="bot-challenge-panel" class="modal" hidden>
      <div class="modal-box">
        <div class="modal-head">
          <h2>🤖 Challenge a bot</h2>
          <button id="bot-challenge-back" class="ghost small">Close</button>
        </div>
        <div id="bot-challenge-body"></div>
      </div>
    </div>

    <noscript><p class="toast">This game needs JavaScript and WebGL.</p></noscript>
    <script type="module" src="/app.js"></script>
  </body>
</html>
